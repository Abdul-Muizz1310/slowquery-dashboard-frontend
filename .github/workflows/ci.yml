name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v5
        with: { version: 10 }
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck

  test:
    needs: lint
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_URL: https://slowquery-demo-backend.onrender.com
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v5
        with: { version: 10 }
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test --run --coverage

  build:
    needs: test
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_URL: https://slowquery-demo-backend.onrender.com
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v5
        with: { version: 10 }
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Spec 07 §4: the signing key's name and the minting code are server-only.
      - name: No server-only signing code in a client bundle
        run: |
          if grep -rlE "SLOWQUERY_FRONTEND_SIGNING_KEY_PRIVATE|createPrivateKey" .next/static; then
            echo "server-only signing code reached .next/static" >&2
            exit 1
          fi

  e2e:
    needs: build
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_URL: https://slowquery-demo-backend.onrender.com
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v5
        with: { version: 10 }
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      # playwright.config.ts makes a throwaway Ed25519 pair, starts a mock
      # backend that verifies tokens like the contract-v2 backend, and runs
      # `pnpm dev` signed with the private half against it; the E2E specs drive
      # the real composed pages and the signing proxy (spec 07 §5).
      - run: pnpm test:e2e

  # NOTE: this frontend has no deploy job of its own (Vercel auto-deploys main
  # on push) — this job verifies the demo BACKEND that push also implies is
  # actually up. It is inert unless the SMOKE_BASE_URL repository variable is
  # set: tests/smoke.test.ts's describe.skipIf makes zero HTTP requests and
  # exits 0 when it's unset, so a fork PR or a suspended free-tier service can
  # never fail CI. The `test` job above deliberately never sets this variable
  # (it would change that job's collected/passed/skipped counts), so this runs
  # only that one file in its own push-gated job.
  smoke:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v5
        with: { version: 10 }
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Post-deploy /health smoke (skipped when SMOKE_BASE_URL is unset)
        env:
          SMOKE_BASE_URL: ${{ vars.SMOKE_BASE_URL }}
        run: pnpm test --run tests/smoke.test.ts
