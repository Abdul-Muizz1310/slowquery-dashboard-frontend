version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # These families must be raised together. Ungrouped, dependabot opens one PR
    # per package and lifts half a pair: react 19.2.8 against react-dom 19.2.4
    # broke all 19 component suites, and @playwright/test 1.62.0 against
    # playwright 1.59.1 gave "Playwright Test did not expect test() to be called
    # here" followed by "No tests found". Neither failure names its cause.
    # Exact package names, not prefixes — "react" must not sweep in react-is.
    # The property itself is asserted in tests/toolchain.test.ts.
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      playwright:
        patterns:
          - "playwright"
          - "@playwright/test"
